  <h1>Local Drive Sync</h1>
  <p>个人自用的 OAuth 客户端，仅由所有者本机的命令行工具（rclone / gog）调用，用于读写所有者自己的 Google Drive。</p>
  <ul>
    <li>不提供服务注册，不接受第三方登录，不面向公众发布。</li>
    <li>只请求完成文件同步所必需的 Google Drive 权限。</li>
    <li>OAuth 令牌仅保存在所有者本机（<code>~/.config/rclone/rclone.conf</code>，权限 0600）。</li>
  </ul>
  <p><a href="./privacy.html">隐私政策 / Privacy Policy</a></p>
